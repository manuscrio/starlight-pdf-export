# Toolchain and commands for this repository. `mise install` provisions everything; `mise tasks`
# lists what you can run.
#
# node   builds the example site, and runs the `manuscrio` npm wrapper through npx. The version
#        matches the one .github/workflows/example.yml uses, so a local run and a CI run are the
#        same run.
#
# Exporting also needs Docker or Podman, which mise does not provision: the `manuscrio` command
# is a thin wrapper that runs the engine image.

[tools]
node = "24"

[tasks.install]
description = "Install the example site's dependencies"
dir = "example"
run = "npm ci"

[tasks.build]
description = "Build the example Starlight site into example/dist"
depends = ["install"]
dir = "example"
run = "npm run build"

[tasks.dev]
description = "Run the example site's dev server"
depends = ["install"]
dir = "example"
run = "npm run dev"

[tasks.inspect]
description = "Report what manuals the example build contains. Starlight reports an empty logo"
depends = ["build"]
run = "npx --yes manuscrio@0.1.0 inspect example/dist"

# --logo is not optional here. Starlight does not describe its logo in the built markup in a way
# an exporter can read, so without it the manual carries no mark at all.
[tasks.export]
description = "Export the example build to PDF manuals, one per edition"
depends = ["build"]
run = """
npx --yes manuscrio@0.1.0 export example/dist \
  --logo example/src/assets/logo.svg \
  --theme lapis \
  --output-dir manuscrio-output
"""
